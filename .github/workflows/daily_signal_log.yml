name: Daily signal log

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas yfinance==1.6.0

      - name: Log today's signals
        run: python backend/paper/log_signals.py

      - name: Commit the log
        run: |
          git config user.name "signal-log-bot"
          git config user.email "signal-log-bot@users.noreply.github.com"
          git add logs/signal_log.csv
          git diff --staged --quiet || git commit -m "Signal log: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
